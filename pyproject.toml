[project]
name = "cathy"
version = "0.2.0"
description = "Fully local text-to-speech narration (Kokoro-82M, GPU-accelerated)"
readme = "README.md"
authors = [
    { name = "Daniel Luca", email = "lucadanielcostin@gmail.com" }
]
# <3.14: torch wheels below 2.9 (see the torch cap) don't exist for 3.14
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.19",
    # spacy model misaki needs; declared here so no runtime `pip install`
    # happens (uv tool environments ship without pip)
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "kokoro>=0.9.4",
    "mobi>=0.4",
    "numpy>=1.26",
    "soundfile>=0.14.0",
    # <2.9: torch 2.10+ PyPI wheels bundle cu130, which hits a cuDNN version
    # mismatch; >=2.6 leaves room for chatterbox's exact pin outside this repo
    "torch>=2.6.0,<2.9",
    "tqdm>=4.70.0",
]

# Engine extras use direct git references so `uv tool install` from anywhere
# resolves the same pinned code this repo was tested against:
# - fish-speech: last S1-era commit (later releases are S2-only, 24 GB VRAM)
# - chatterbox: Chatterbox-Nano release, absent from PyPI
[project.optional-dependencies]
# torchaudio <2.9 keeps its CUDA build aligned with the capped torch above
qwen = ["qwen-tts>=0.1.1", "torchaudio>=2.6.0,<2.9"]
chatterbox = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
    "torchaudio>=2.6.0,<2.9",
]
fish = [
    "fish-speech @ git+https://github.com/fishaudio/fish-speech@ec8bf2b343a5d601d77fe2ae5008bdc6b53034f5",
    "torchaudio>=2.6.0,<2.9",
]

[project.scripts]
cathy = "cathy:main"

# On Windows, PyPI torch wheels are CPU-only; CUDA builds come from the
# pytorch.org index (on Linux the PyPI wheels already bundle CUDA 12.8)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.uv]
# Rebuild when source changes, not only pyproject.toml — otherwise delegated
# engine environments built from a local CATHY_SOURCE serve stale code
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
# The engine extras pin mutually incompatible torch/transformers versions, so
# they are mutually exclusive environments: uv run --extra qwen cathy ...
conflicts = [
    [
        { extra = "qwen" },
        { extra = "chatterbox" },
        { extra = "fish" },
    ],
]
# One uniform torch for repo development (PyPI's 2.8.0 default build is
# cu128); delegated tool environments resolve their own from the metadata.
override-dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "protobuf>=3.20.0,<6.0.0",
    # newer tensorboard ships protobuf-6 gencode, incompatible with the cap above
    "tensorboard>=2.14.1,<2.20",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
